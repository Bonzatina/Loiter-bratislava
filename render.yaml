# Render Blueprint — deploy with "New > Blueprint" pointing at this repo.
# The Node app lives in web/; the wiki content is read from ../wiki at runtime,
# which works because Render clones the whole repo and rootDir only sets the cwd.
services:
  - type: web
    name: loiter-bratislava
    runtime: node
    plan: free
    rootDir: web
    # --no-audit --no-fund sidesteps npm's "Exit handler never called" crash
    # seen on Render's builders (network side-calls at the end of install).
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm start
